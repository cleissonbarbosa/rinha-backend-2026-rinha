services:
  api1:
    image: cleissonb/rinha-backend-2026-rinha-api:latest
    platform: linux/amd64
    environment:
      API_ADDR: 0.0.0.0:8080
      API_FD_SOCKET: /sockets/api1.sock
      RINHA_INDEX_PATH: /app/index/rinha-specialist.idx
      RINHA_SEARCH_MODE: key-first
      RINHA_NET_MAX_THREADS: "512"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    expose:
      - "8080"
    volumes:
      - sockets:/sockets
    networks:
      - rinha
    cpus: 0.42
    mem_limit: 165m
    restart: unless-stopped

  api2:
    image: cleissonb/rinha-backend-2026-rinha-api:latest
    platform: linux/amd64
    environment:
      API_ADDR: 0.0.0.0:8080
      API_FD_SOCKET: /sockets/api2.sock
      RINHA_INDEX_PATH: /app/index/rinha-specialist.idx
      RINHA_SEARCH_MODE: key-first
      RINHA_NET_MAX_THREADS: "512"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    expose:
      - "8080"
    volumes:
      - sockets:/sockets
    networks:
      - rinha
    cpus: 0.42
    mem_limit: 165m
    restart: unless-stopped

  lb:
    image: cleissonb/rinha-backend-2026-rinha-lb:latest
    platform: linux/amd64
    environment:
      LB_ADDR: 0.0.0.0
      LB_PORT: "9999"
      BACKEND1: api1:8080
      BACKEND2: api2:8080
      FD_BACKEND1: /sockets/api1.sock
      FD_BACKEND2: /sockets/api2.sock
      WORKERS: "2"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    volumes:
      - sockets:/sockets
    networks:
      - rinha
    cpus: 0.16
    mem_limit: 20m
    restart: unless-stopped

networks:
  rinha:
    driver: bridge

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m
