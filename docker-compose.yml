services:
  api1:
    image: cleissonb/rinha-backend-2026-rinha-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    platform: linux/amd64
    environment:
      API_ADDR: 0.0.0.0:8080
      RESOURCES_DIR: /app/resources
      KNN_CANDIDATES: "128"
      RINHA_PROBE: "3"
      RINHA_NET_MAX_THREADS: "256"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    expose:
      - "8080"
    networks:
      - rinha
    cpus: 0.425
    mem_limit: 160m
    restart: unless-stopped

  api2:
    image: cleissonb/rinha-backend-2026-rinha-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    platform: linux/amd64
    environment:
      API_ADDR: 0.0.0.0:8080
      RESOURCES_DIR: /app/resources
      KNN_CANDIDATES: "128"
      RINHA_PROBE: "3"
      RINHA_NET_MAX_THREADS: "256"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    expose:
      - "8080"
    networks:
      - rinha
    cpus: 0.425
    mem_limit: 160m
    restart: unless-stopped

  lb:
    image: cleissonb/rinha-backend-2026-rinha-lb:latest
    build:
      context: .
      dockerfile: Dockerfile.lb
    platform: linux/amd64
    environment:
      LB_ADDR: 0.0.0.0:9999
      BACKEND1: api1:8080
      BACKEND2: api2:8080
      RINHA_NET_MAX_THREADS: "256"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - rinha
    cpus: 0.15
    mem_limit: 30m
    restart: unless-stopped

networks:
  rinha:
    driver: bridge
